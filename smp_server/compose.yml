services:
  smp-server:
    image: docker.io/simplexchat/smp-server:v7.1
    restart: unless-stopped
    environment:
      ADDR: smp.cdreamz.duckdns.org
      PASS: "${SMP_PASSWORD:-}"
      WEB_MANUAL: "1"
    volumes:
      - smp-config:/etc/opt/simplex:Z
      - smp-state:/var/opt/simplex:Z
    ports:
      - "5223:5223/tcp"
    networks:
      edge:
        aliases:
          - smp-server

  xftp-server:
    image: docker.io/simplexchat/xftp-server:v7.1
    restart: unless-stopped
    environment:
      ADDR: xftp.cdreamz.duckdns.org
      QUOTA: "${XFTP_QUOTA:-120gb}"
      PASS: "${XFTP_PASSWORD:-}"
    volumes:
      - xftp-config:/etc/opt/simplex-xftp:Z
      - xftp-state:/var/opt/simplex-xftp:Z
      - xftp-files:/srv/xftp:Z
    ports:
      - "8443:443/tcp"
    networks:
      edge:
        aliases:
          - xftp-server

volumes:
  smp-config:
  smp-state:
  xftp-config:
  xftp-state:
  xftp-files:

networks:
  edge:
    external: true
    name: edge