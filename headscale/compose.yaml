services:
  headscale:
    image: ghcr.io/juanfont/headscale:v0.29.4
    restart: unless-stopped
    command: serve
    user: "10001:10001"
    labels:
      me.tale.headplane.target: headscale
    volumes:
      - ./config/config.yaml:/etc/headscale/config.yaml:ro,z
      - headscale-data:/var/lib/headscale:Z
      - headscale-run:/var/run/headscale:Z
    networks:
      internal:
        aliases:
          - headscale-api
      edge:
    healthcheck:
      disable: true

  headplane:
    image: ghcr.io/tale/headplane:0.7.1
    restart: unless-stopped
    depends_on:
      headscale:
        condition: service_started
    environment:
      HEADPLANE_SERVER__COOKIE_SECRET: "${HEADPLANE_COOKIE_SECRET:?Set HEADPLANE_COOKIE_SECRET in .env}"
    volumes:
      - ./headplane/config.yaml:/etc/headplane/config.yaml:ro,Z
      - headplane-data:/var/lib/headplane:Z
      - ./config/config.yaml:/etc/headscale/config.yaml:ro,z
      - ${CONTAINER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    networks:
      internal:
        aliases:
          - headplane-ui
      edge:

volumes:
  headscale-data:
  headscale-run:
  headplane-data:

networks:
  internal:
  edge:
    external: true
    name: edge
