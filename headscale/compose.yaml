services:
  headscale-config:
    image: docker.io/library/alpine:3.20
    restart: "no"
    environment:
      HEADSCALE_SERVER_URL: "${HEADSCALE_SITE:?Set HEADSCALE_SITE in .env}"
      HEADSCALE_DNS_BASE_DOMAIN: "${HEADSCALE_BASE_DOMAIN:?Set HEADSCALE_BASE_DOMAIN in .env}"
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache gettext >/dev/null
        envsubst '$$HEADSCALE_SERVER_URL $$HEADSCALE_DNS_BASE_DOMAIN' < /template/config.yaml > /rendered/config.yaml
    volumes:
      - ./config/config.yaml:/template/config.yaml:ro,Z
      - headscale-config:/rendered:Z

  headscale:
    image: ghcr.io/juanfont/headscale:v0.29.4
    restart: unless-stopped
    command: serve
    user: "10001:10001"
    depends_on:
      headscale-config:
        condition: service_completed_successfully
    labels:
      me.tale.headplane.target: headscale
    volumes:
      - headscale-config:/etc/headscale:ro,Z
      - headscale-data:/var/lib/headscale:Z
      - headscale-run:/var/run/headscale:Z
    networks:
      internal:
        aliases:
          - headscale-api
      edge:
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  headplane:
    image: ghcr.io/tale/headplane:0.7.1
    restart: unless-stopped
    depends_on:
      headscale:
        condition: service_healthy
    environment:
      HEADPLANE_SERVER__COOKIE_SECRET: "${HEADPLANE_COOKIE_SECRET:?Set HEADPLANE_COOKIE_SECRET in .env}"
      HEADPLANE_SERVER__BASE_URL: "${HEADPLANE_SITE:?Set HEADPLANE_SITE in .env}"
      HEADPLANE_HEADSCALE__PUBLIC_URL: "${HEADSCALE_SITE:?Set HEADSCALE_SITE in .env}"
    volumes:
      - ./headplane/config.yaml:/etc/headplane/config.yaml:ro,Z
      - headplane-data:/var/lib/headplane:Z
      - headscale-config:/etc/headscale:ro,Z
      - ${CONTAINER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    networks:
      internal:
        aliases:
          - headplane-ui
      edge:

volumes:
  headscale-config:
  headscale-data:
  headscale-run:
  headplane-data:

networks:
  internal:
  edge:
    external: true
    name: edge
