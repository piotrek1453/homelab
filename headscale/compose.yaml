services:
  headscale:
    image: ghcr.io/juanfont/headscale:v0.29.7
    restart: unless-stopped
    command: serve
    user: "10001:10001"
    labels:
      me.tale.headplane.target: headscale
    volumes:
      - ./config:/etc/headscale:ro,z
      - headscale-data:/var/lib/headscale:Z
      - headscale-run:/var/run/headscale:Z
    networks:
      internal:
        aliases:
          - headscale-api
      edge:
    healthcheck:
      disable: true

  headplane:
    image: ghcr.io/tale/headplane:0.8.2
    restart: unless-stopped
    security_opt:
      - label=disable
    depends_on:
      headscale:
        condition: service_started
    environment:
      HEADPLANE_SERVER__COOKIE_SECRET: "${HEADPLANE_COOKIE_SECRET:?Set HEADPLANE_COOKIE_SECRET in .env}"
    volumes:
      - ./headplane/config.yaml:/etc/headplane/config.yaml:ro,Z
      - headplane-data:/var/lib/headplane:Z
      - ./config:/etc/headscale:z
      - ${CONTAINER_SOCKET:?Set CONTAINER_SOCKET to the rootless Podman socket}:/var/run/docker.sock
    networks:
      internal:
        aliases:
          - headplane-ui
      edge:

volumes:
  headscale-data:
  headscale-run:
  headplane-data:

networks:
  internal:
  edge:
    external: true
    name: edge
