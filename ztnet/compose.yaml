services:
  postgres:
    image: docker.io/library/postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: ztnet
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres-data:/var/lib/postgresql/data:Z
    networks:
      internal:
        aliases:
          - ztnet-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ztnet"]
      interval: 10s
      timeout: 5s
      retries: 10

  zerotier:
    image: docker.io/zyclonite/zerotier:1.16.2
    restart: unless-stopped
    volumes:
      - zerotier-data:/var/lib/zerotier-one:z
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "9993:9993/udp"
    environment:
      ZT_OVERRIDE_LOCAL_CONF: "true"
      ZT_ALLOW_MANAGEMENT_FROM: "172.31.255.0/29"
    networks:
      - internal

  ztnet:
    image: docker.io/sinamics/ztnet:0.8.7
    restart: unless-stopped
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      zerotier:
        condition: service_started
    volumes:
      - zerotier-data:/var/lib/zerotier-one:z
    environment:
      HOSTNAME: 0.0.0.0
      POSTGRES_HOST: ztnet-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: ztnet
      NEXTAUTH_URL: https://ztnet.cdreamz.duckdns.org
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}"
      NEXTAUTH_URL_INTERNAL: http://ztnet-app:3000
    networks:
      internal:
        aliases:
          - ztnet-app
      edge:
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
    name: ztnet_postgres18-data
  zerotier-data:
    name: ztnet_zerotier

networks:
  internal:
    ipam:
      config:
        - subnet: 172.31.255.0/29
  edge:
    external: true
    name: edge
