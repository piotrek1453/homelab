services:
  postgres:
    image: docker.io/library/postgres:15.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: ztnet
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ztnet"]
      interval: 10s
      timeout: 5s
      retries: 10

  zerotier:
    image: docker.io/zyclonite/zerotier:1.14.2
    restart: unless-stopped
    volumes:
      - zerotier-data:/var/lib/zerotier-one
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "9993:9993/udp"
    environment:
      ZT_OVERRIDE_LOCAL_CONF: "true"
      ZT_ALLOW_MANAGEMENT_FROM: "172.31.255.0/29"
    networks:
      - internal

  ztnet:
    image: docker.io/sinamics/ztnet:latest
    restart: unless-stopped
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      zerotier:
        condition: service_started
    volumes:
      - zerotier-data:/var/lib/zerotier-one
    environment:
      POSTGRES_HOST: ztnet-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: ztnet
      NEXTAUTH_URL: "${NEXTAUTH_URL:-https://ztnet.example.com}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}"
      NEXTAUTH_URL_INTERNAL: http://ztnet-app:3000
    networks:
      internal:
        aliases:
          - ztnet-app
      edge:
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
    name: ztnet_postgres-data
  zerotier-data:
    name: ztnet_zerotier

networks:
  internal:
    ipam:
      config:
        - subnet: 172.31.255.0/29
  edge:
    external: true
    name: edge
